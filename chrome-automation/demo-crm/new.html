<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新規顧客登録 | クモゲート顧客管理システム(デモ)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">クモゲート顧客管理システム</div>
    <div class="user">ログイン中: 営業部 / 一般ユーザー &nbsp;|&nbsp; デモ環境</div>
  </header>

  <div class="app-body">
    <nav class="sidebar">
      <ul>
        <li><a href="index.html">顧客一覧</a></li>
        <li><a href="new.html" class="active">新規登録</a></li>
        <li><a href="#" onclick="return false;">案件管理</a></li>
        <li><a href="#" onclick="return false;">請求書</a></li>
        <li><a href="#" onclick="return false;">設定</a></li>
      </ul>
    </nav>

    <main class="main">
      <div class="breadcrumb"><a href="index.html">顧客一覧</a> ＞ 新規登録</div>
      <h1 class="page-title">新規顧客登録</h1>
      <p class="page-desc">新しい顧客情報を入力してください。（このページはポートフォリオ用のダミーフォームです。送信データはこのブラウザ内にのみ保存されます）</p>

      <form class="form-box" id="newCustomerForm" autocomplete="off">
        <div class="form-row">
          <label for="company">会社名 <span style="color:#c33;">*</span></label>
          <input type="text" id="company" name="company" required placeholder="例）株式会社サンプル商事">
        </div>
        <div class="form-row">
          <label for="person">担当者名 <span style="color:#c33;">*</span></label>
          <input type="text" id="person" name="person" required placeholder="例）山田 太郎">
        </div>
        <div class="form-row">
          <label for="phone">電話番号</label>
          <input type="tel" id="phone" name="phone" placeholder="例）03-1234-5678">
        </div>
        <div class="form-row">
          <label for="email">メールアドレス <span style="color:#c33;">*</span></label>
          <input type="email" id="email" name="email" required placeholder="例）yamada@example.com">
        </div>
        <div class="form-row">
          <label for="plan">プラン</label>
          <select id="plan" name="plan">
            <option value="フリー">フリー</option>
            <option value="スタンダード">スタンダード</option>
            <option value="プレミアム">プレミアム</option>
          </select>
        </div>
        <div class="form-row">
          <label for="note">備考</label>
          <textarea id="note" name="note" placeholder="商談メモなど"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn" id="submitBtn">登録</button>
          <a href="index.html" class="btn secondary" style="margin-left:8px;">一覧に戻る</a>
        </div>
      </form>
    </main>
  </div>

  <div id="toast"></div>

  <script src="data/customers.js"></script>
  <script>
    var form = document.getElementById("newCustomerForm");
    var toast = document.getElementById("toast");
    var toastTimer = null;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200);
    }

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();

      var customer = {
        company: document.getElementById("company").value.trim(),
        person: document.getElementById("person").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        plan: document.getElementById("plan").value,
        status: "見込み客",
        updated: new Date().toISOString().slice(0, 10),
        note: document.getElementById("note").value.trim()
      };

      if (!customer.company || !customer.person || !customer.email) {
        showToast("必須項目を入力してください");
        return;
      }

      window.DemoCRM.addCustomer(customer);
      showToast("「" + customer.company + "」を登録しました");
      form.reset();
      document.getElementById("company").focus();
    });
  </script>
</body>
</html>
